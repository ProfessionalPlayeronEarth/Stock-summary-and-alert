name: stella-report

on:
  schedule:
    # 四个任务 · 云端简易版（北京时间），不依赖本地电脑开机，确保微信必达：
    # 9:00 BJ  = 1:00 UTC   — 晨报（全年）
    # 16:00 BJ = 8:00 UTC   — 霍尔木兹简易版（全年）
    # 20:30 BJ = 12:30 UTC  — 盘前（夏令时）
    # 21:30 BJ = 13:30 UTC  — 盘前（冬令时）
    # 盘前两个触发点同时挂载，脚本内按美国夏令时规则自动取舍，错季静默跳过
    - cron: "0 1 * * *"
    - cron: "0 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning=晨报 / premarket=盘前 / hormuz=霍尔木兹 / 留空=按时间自动判断"
        default: ""
  repository_dispatch:
    types: [run-report] # 外部 cron 兜底（GitHub schedule 失联备胎）

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run report
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SLOT: ${{ github.event.inputs.slot }}
        run: python hourly_report.py
