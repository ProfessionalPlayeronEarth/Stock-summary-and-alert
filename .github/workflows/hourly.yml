name: stella-report

on:
  schedule:
    # 每日两次（北京时间），云端触发，不依赖本地电脑开机：
    # 9:00 BJ  = 1:00 UTC  — 晨报（全年；避开 0:00 UTC 全球拥堵时段，降低丢跑概率）
    # 20:30 BJ = 12:30 UTC — 盘前（夏令时）
    # 21:30 BJ = 13:30 UTC — 盘前（冬令时）
    # 盘前两个触发点同时挂载，脚本内按美国夏令时规则自动取舍，错季静默跳过
    - cron: "0 1 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {} # 允许手动触发测试

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run report
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python hourly_report.py
